<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Details - Omega-Roll</title>
    <script>
        window.siteRoot = /github\.io/i.test(window.location.hostname) ? '/omega-roll' : '';
        window.resolveSitePath = (path) => `${window.siteRoot}${path.startsWith('/') ? path : '/' + path}`;
    </script>
    <link rel="icon" id="site-favicon" href="">
    <link rel="shortcut icon" id="site-favicon-alt" href="">
    <link rel="stylesheet" id="site-style" href="../assets/css/style.css">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const favicon = document.getElementById('site-favicon');
            const faviconAlt = document.getElementById('site-favicon-alt');
            const style = document.getElementById('site-style');
            if (favicon) favicon.href = window.resolveSitePath('/images/icon.ico');
            if (faviconAlt) faviconAlt.href = window.resolveSitePath('/images/icon.ico');
            if (style) style.href = window.resolveSitePath('/assets/css/style.css');
        });
    </script>
    <style>
        .page-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 28px;
            align-items: start;
        }

        .details-wrapper {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
            align-items: flex-start;
        }

        .poster-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
            width: 260px;
        }

        .poster-container {
            position: relative;
            width: 100%;
        }

        .details-poster {
            width: 100%;
            height: auto;
            border-radius: 10px;
            object-fit: cover;
            display: block;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .poster-type-tag {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(57, 255, 20, 0.5);
            color: var(--neon-green, #39ff14);
            font-size: 0.72rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
            z-index: 5;
        }

        .meta-badges-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .meta-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .meta-badge svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: var(--neon-green);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .meta-badge-span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .details-info {
            flex-grow: 1;
            min-width: 0;
        }

        .poster-actions {
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            gap: 6px;
            z-index: 5;
        }

        .broadcast-card {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(57, 255, 20, 0.05);
            border: 1px solid rgba(57, 255, 20, 0.2);
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 14px;
            font-size: 0.82rem;
        }

        .broadcast-card svg {
            width: 16px;
            height: 16px;
            stroke: var(--neon-green);
            stroke-width: 2;
            fill: none;
            flex-shrink: 0;
        }

        .episode-sidebar {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            max-height: 680px;
        }

        .episode-search-box {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 12px;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #fff;
            font-size: 0.88rem;
            outline: none;
        }

        .episode-search-box:focus {
            border-color: var(--neon-green, #39ff14);
        }

        .episode-scroll-list {
            list-style: none;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
            margin: 0;
        }

        .episode-item {
            list-style: none;
        }

        .episode-item a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: background 0.2s ease;
        }

        .episode-item a:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        @media (max-width: 900px) {
            .page-layout {
                grid-template-columns: 1fr;
            }
            .details-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .poster-column {
                width: 100%;
                max-width: 260px;
            }
        }

        .broadcast-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .broadcast-card {
            margin-top: 0;
        }

        .follow-schedule-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            padding: 0;
            margin-top: 0;
            border-radius: 8px;
            background: rgba(57, 255, 20, 0.05);
            border: 1px solid rgba(57, 255, 20, 0.2);
            color: var(--neon-green);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .follow-schedule-btn:hover {
            background: rgba(57, 255, 20, 0.2);
            border-color: var(--neon-green);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        .follow-schedule-btn.saved {
            background: var(--neon-green);
            color: #000;
            border-color: var(--neon-green);
        }
    </style>
</head>
<body>
<header></header>

<main class="container">
    <div class="page-layout">
        <div class="main-content">
            <div class="details-wrapper" id="anime-details"></div>
        </div>

        <aside class="episode-sidebar">
            <h3 style="margin-bottom: 12px; font-size: 1.1rem;">Episodes</h3>
            <input type="text" id="episode-search" class="episode-search-box" placeholder="Search episode number or title...">
            <ul class="episode-scroll-list" id="episode-list"></ul>
            <div id="load-more-container"></div>
        </aside>
    </div>
</main>

<script src="../assets/js/redirect-blocker.js"></script>
<script src="../assets/js/header.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/anime.js"></script>
</body>
</html>
