<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Details - Omega-Roll</title>
    <script>
        window.siteRoot = /github\.io/i.test(window.location.hostname) ? '/omega-roll' : '';
        window.resolveSitePath = (path) => `${window.siteRoot}${path.startsWith('/') ? path : '/' + path}`;
    </script>
    <link rel="icon" id="site-favicon" href="">
    <link rel="shortcut icon" id="site-favicon-alt" href="">
    <link rel="stylesheet" id="site-style" href="../assets/css/style.css">
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const favicon = document.getElementById('site-favicon');
            const faviconAlt = document.getElementById('site-favicon-alt');
            const style = document.getElementById('site-style');
            if (favicon) favicon.href = window.resolveSitePath('/images/icon.ico');
            if (faviconAlt) faviconAlt.href = window.resolveSitePath('/images/icon.ico');
            if (style) style.href = window.resolveSitePath('/assets/css/style.css');
        });
    </script>
    <style>
        .page-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
            align-items: start;
        }

        .details-wrapper {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
        }

        .details-poster {
            width: 220px;
            height: auto;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .details-info {
            flex-grow: 1;
        }

        /* Right Side Episode Picker Sidebar */
        .episode-sidebar {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            max-height: 680px;
        }

        .episode-search-box {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 12px;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #fff;
            font-size: 0.88rem;
            outline: none;
        }

        .episode-search-box:focus {
            border-color: var(--accent, #3b82f6);
        }

        .episode-scroll-list {
            list-style: none;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .episode-item a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: background 0.2s ease;
        }

        .episode-item a:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        @media (max-width: 900px) {
            .page-layout {
                grid-template-columns: 1fr;
            }
            .details-wrapper {
                flex-direction: column;
            }
            .details-poster {
                width: 100%;
                max-width: 240px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
<header></header>

<main class="container">
    <div class="page-layout">
        <!-- Left Side: Details & Recommendations -->
        <div class="main-content">
            <div class="details-wrapper" id="anime-details"></div>
            <div id="recommendations-section"></div>
        </div>

        <!-- Right Side: Searchable Episode Picker -->
        <aside class="episode-sidebar">
            <h3 style="margin-bottom: 12px; font-size: 1.1rem;">Episodes</h3>
            <input type="text" id="episode-search" class="episode-search-box" placeholder="Search episode number or title...">
            <ul class="episode-scroll-list" id="episode-list"></ul>
            <div id="load-more-container"></div>
        </aside>
    </div>
</main>

<script src="../assets/js/redirect-blocker.js"></script>
<script src="../assets/js/header.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/anime.js"></script>
</body>
</html>
