<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching - Omega-Roll</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .watch-page { max-width: 1400px; margin: 0 auto; padding: 16px 20px 60px; }
        .watch-header-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 16px; }
        #back-to-anime { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: color 0.2s ease; }
        #back-to-anime:hover { color: #fff; }
        
        .watch-title-block { margin-bottom: 20px; }
        .watch-title-block h1 { font-size: 1.6rem; font-weight: 700; margin: 0; color: var(--text-color); }

        .watch-layout { display: grid; grid-template-columns: 1fr 340px; gap: 28px; align-items: start; }
        
        /* Video Container */
        .video-column { width: 100%; min-width: 0; }
        .video-player-container { 
            position: relative; 
            background: #000; 
            width: 100%; 
            aspect-ratio: 16/9; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .video-player-container iframe { width: 100%; height: 100%; border: none; }

        /* Streaming Sidebar */
        .watch-sidebar { 
            background: rgba(15, 20, 28, 0.75); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 16px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            backdrop-filter: blur(12px);
        }
        
        /* Segmented Control for Sub/Dub */
        .audio-toggle-group { 
            display: flex; 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 10px; 
            padding: 4px; 
            gap: 4px; 
        }
        .switch-btn { 
            flex: 1; 
            background: transparent; 
            color: var(--text-muted); 
            border: none; 
            padding: 8px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 0.85rem; 
            transition: all 0.2s ease; 
        }
        .switch-btn.active { 
            background: rgba(255, 255, 255, 0.12); 
            color: #fff; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.3); 
        }
        .switch-btn:hover:not(.active) { color: #fff; background: rgba(255, 255, 255, 0.05); }

        /* Episode Picker Layout */
        .episode-picker-shell { display: flex; flex-direction: column; gap: 14px; }
        .episode-picker-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .ep-nav-btn { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            color: #fff; 
            padding: 8px 12px; 
            border-radius: 8px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s ease; 
        }
        .ep-nav-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }
        .ep-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .episode-current-indicator { 
            font-size: 0.9rem; 
            font-weight: 700; 
            color: #fff; 
        }

        .episode-picker-search { 
            width: 100%; 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #fff; 
            border-radius: 8px; 
            padding: 10px 14px; 
            font-size: 0.85rem; 
        }
        .episode-picker-search:focus { outline: none; border-color: rgba(255, 255, 255, 0.3); }

        .episode-picker-list { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            max-height: 380px; 
            overflow-y: auto; 
            padding-right: 4px; 
        }
        .episode-picker-list::-webkit-scrollbar { width: 6px; }
        .episode-picker-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .episode-chip { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            text-align: left; 
            width: 100%; 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 8px; 
            padding: 10px 12px; 
            color: var(--text-color); 
            cursor: pointer; 
            transition: 0.2s ease; 
        }
        .episode-chip:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.15); }
        .episode-chip.active { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); }
        .episode-chip-number { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); min-width: 42px; }
        .episode-chip.active .episode-chip-number { color: #fff; }
        .episode-chip-title { font-size: 0.85rem; line-height: 1.3; color: var(--text-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .pin-btn { 
            width: 100%; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #fff; 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .pin-btn:hover { background: rgba(255, 255, 255, 0.12); }

        .episode-picker-select { display: none; }

        @media (max-width: 1024px) {
            .watch-layout { grid-template-columns: 1fr; }
            .watch-sidebar { width: 100%; }
        }
    </style>
</head>
<body>
<header></header>

<main class="watch-page">
    <div class="watch-header-nav">
        <a id="back-to-anime" href="#">← Back to Details</a>
    </div>

    <div class="watch-title-block">
        <h1 id="video-title">Loading Episode...</h1>
    </div>

    <div class="watch-layout">
        <div class="video-column">
            <div class="video-player-container" id="video-player-container"></div>
        </div>

        <aside class="watch-sidebar">
            <div class="audio-toggle-group" aria-label="Audio options">
                <button id="btn-sub" class="switch-btn active">SUB</button>
                <button id="btn-dub" class="switch-btn">DUB</button>
            </div>

            <div class="episode-picker-shell" aria-label="Episode picker">
                <div class="episode-picker-toolbar">
                    <button type="button" id="prev-episode-btn" class="ep-nav-btn" aria-label="Previous episode">← Prev</button>
                    <span id="episode-current-indicator" class="episode-current-indicator">Ep 1</span>
                    <button type="button" id="next-episode-btn" class="ep-nav-btn" aria-label="Next episode">Next →</button>
                </div>
                <input type="search" id="episode-search" class="episode-picker-search" placeholder="Search episodes..." aria-label="Search episode title" />
                <div id="episode-picker-list" class="episode-picker-list"></div>
                <select id="ep-picker" class="episode-picker-select" aria-label="Episode selector"></select>
            </div>

            <button id="pin-episode-btn" class="pin-btn">📌 Pin Current Progress</button>
        </aside>
    </div>
</main>

<script src="js/redirect-blocker.js"></script>
<script src="js/header.js"></script>
<script src="js/api.js"></script>
<script src="js/watch.js"></script>
</body>
</html>
